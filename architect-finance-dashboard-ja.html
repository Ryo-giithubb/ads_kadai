<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>建築設計事務所 収支ダッシュボード</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#fff;
      --fill-3:rgba(20,20,20,.04);--fill-4:rgba(20,20,20,.025);
      --s1:rgba(20,20,20,.18);--s2:rgba(20,20,20,.1);
      --t1:rgba(20,20,20,.88);--t2:rgba(20,20,20,.54);--t3:rgba(20,20,20,.35);
      --accent:#2e76ab;--green:#1a7a58;--red:#c0304a;
      --green-bg:rgba(26,122,88,.1);--red-bg:rgba(192,48,74,.08);
      --green-bar:#1f8a65;--red-bar:#e05575;
    }
    body{background:var(--bg);color:var(--t1);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Segoe UI",sans-serif;font-size:14px;line-height:1.5}
    .page{max-width:1540px;margin:0 auto;padding:24px 28px}

    /* mode */
    .mode-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;border-radius:7px;margin-bottom:18px;font-size:13px;font-weight:500}
    .mode-bar.staff{background:rgba(46,118,171,.1);border:1px solid rgba(46,118,171,.3);color:#2e76ab}
    .mode-bar.admin{background:rgba(26,122,88,.1);border:1px solid rgba(26,122,88,.3);color:#1a7a58}
    .mode-btn{padding:5px 14px;border-radius:5px;border:none;cursor:pointer;font-size:12px;font-weight:500}
    .mode-bar.staff .mode-btn{background:#2e76ab;color:#fff}
    .mode-bar.admin .mode-btn{background:#1a7a58;color:#fff}

    /* header */
    .header{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
    .header h1{font-size:22px;font-weight:700;flex:1}
    .header .sub{font-size:12px;color:var(--t2)}
    .yr-row{display:flex;align-items:center;gap:6px}
    select,.yr-select{background:#fff;border:1px solid var(--s1);color:var(--t1);padding:5px 10px;border-radius:5px;font-size:13px;cursor:pointer;outline:none}
    select:focus,.yr-select:focus{border-color:var(--accent)}
    .icon-btn{width:28px;height:28px;border-radius:5px;border:1px solid var(--s1);background:#fff;color:var(--t2);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .icon-btn:hover{background:var(--fill-3)}
    .yr-add-input{width:70px;padding:5px 8px;border:1px solid var(--accent);border-radius:5px;font-size:13px;outline:none}

    /* summary */
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
    .stat-card{border:1px solid var(--s2);border-radius:8px;padding:13px 16px}
    .stat-value{font-size:19px;font-weight:590}
    .stat-label{font-size:11px;color:var(--t2);margin-top:3px}
    .stat-sub{font-size:11px;color:var(--t3);margin-top:2px}
    .stat-card.green .stat-value{color:var(--green)}
    .stat-card.red   .stat-value{color:var(--red)}
    .stat-card.blue  .stat-value{color:var(--accent)}
    .ovhd-row{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11px;color:var(--t2)}

    .divider{border:none;border-top:1px solid var(--s2);margin:22px 0}
    h2{font-size:16px;font-weight:590;margin-bottom:12px}

    /* table */
    .tbl-wrap{overflow-x:auto}
    table{border-collapse:collapse;width:100%;table-layout:fixed}
    col.c-proj{width:33.33%}
    col.c-in  {width:33.33%}
    col.c-out {width:33.34%}
    th{padding:7px 12px;font-size:11px;font-weight:600;color:var(--t1);text-align:left;border-bottom:2px solid var(--s1);white-space:nowrap;vertical-align:bottom}
    th.in-bg{background:var(--green-bg)}
    th.out-bg{background:var(--red-bg)}
    th.bl{border-left:2px solid var(--s1)}
    td{padding:10px 12px;border-bottom:1px solid var(--s2);font-size:13px;vertical-align:top;word-break:break-word}
    td.bl{border-left:2px solid var(--s1)}
    tr.odd td{background:var(--fill-4)}
    /* strong row separator */
    tbody tr td{border-top:2px solid var(--s1)}
    tbody tr:first-child td{border-top:none}

    /* inputs */
    input[type=number],input[type=text].ipt{background:#fff;border:1px solid var(--s1);color:var(--t1);padding:3px 7px;border-radius:4px;font-size:12px;outline:none}
    input[type=number]{-moz-appearance:textfield;text-align:right}
    input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
    input:focus{border-color:var(--accent)}
    input[type=checkbox]{width:14px;height:14px;accent-color:var(--green-bar);cursor:pointer;vertical-align:middle}
    .ipt-u{font-size:11px;color:var(--t3);margin-left:2px}
    .note-ipt{width:100%;font-size:11px;color:var(--t2);padding:3px 6px;border-radius:4px;background:var(--fill-3);border:1px solid transparent;outline:none;margin-top:4px}
    .note-ipt:focus{background:#fff;border-color:var(--accent)}

    /* pane 1 */
    .p1-cell{min-width:200px}
    .proj-line{display:flex;align-items:baseline;gap:6px;margin-bottom:5px}
    .proj-no-ipt,.proj-name-ipt{background:transparent;border:none;border-bottom:1px solid var(--s2);color:var(--t1);outline:none;padding:1px 0}
    .proj-no-ipt{width:72px;font-family:monospace;font-size:11px;letter-spacing:.5px;color:var(--t2)}
    .proj-name-ipt{flex:1;min-width:110px;font-size:16px;font-weight:700;color:var(--t1)}
    .proj-no-ipt:focus,.proj-name-ipt:focus{border-bottom-color:var(--accent)}
    .proj-collapsed-row{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;flex-wrap:wrap}
    .proj-collapsed-row:hover{background:var(--fill-3)}
    .mini-box{background:var(--fill-3);border-radius:5px;padding:7px 10px;margin-top:6px;font-size:12px}
    .mini-row{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
    .mini-lbl{color:var(--t2)}
    .mini-val{font-weight:600}
    .mini-val.green{color:var(--green)}.mini-val.red{color:var(--red)}.mini-val.blue{color:var(--accent)}
    .mini-hr{border:none;border-top:1px solid var(--s2);margin:4px 0}

    /* pill */
    .pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:500}
    .pill-neutral{background:var(--fill-3);color:var(--t2)}
    .pill-success{background:rgba(26,122,88,.13);color:var(--green)}
    .pill-warning{background:rgba(176,104,0,.13);color:#b06800}
    .pill-danger{background:rgba(192,48,74,.1);color:var(--red)}

    /* design fee table */
    .df-table{width:100%;border-collapse:collapse;font-size:11px;margin:6px 0;table-layout:fixed}
    .df-table colgroup .df-c1{width:40%}
    .df-table colgroup .df-c2{width:17%}
    .df-table colgroup .df-c3{width:17%}
    .df-table colgroup .df-c4{width:20%}
    .df-table colgroup .df-c5{width:6%}
    .df-table th{background:var(--fill-3);color:var(--t2);font-weight:600;padding:3px 6px;text-align:right;white-space:nowrap;overflow:hidden}
    .df-table th:first-child{text-align:left}
    .df-table td{padding:3px 6px;border-bottom:1px solid var(--s2);text-align:right;vertical-align:middle;overflow:hidden}
    .df-table td:first-child{text-align:left}
    .df-table input{width:100%;box-sizing:border-box}
    .df-total{display:flex;justify-content:space-between;align-items:center;padding:5px 6px;background:rgba(46,118,171,.12);border-radius:4px;font-size:12px;font-weight:600;border:1px solid rgba(46,118,171,.25)}

    /* pane 2 */
    .p2-cell{min-width:290px}
    .ck-label{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--t2);cursor:pointer;margin-right:10px}
    .contract-row{display:flex;align-items:center;gap:6px;padding:7px 0 9px;border-bottom:1px solid var(--s2);margin-bottom:9px}
    .pct-badge{font-size:11px;color:var(--accent);background:rgba(46,118,171,.1);padding:1px 6px;border-radius:3px;margin-left:3px}
    .pay-block{border:1px solid var(--s2);border-radius:5px;padding:8px 10px;margin-bottom:7px;background:#fff}
    .pay-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
    .pay-title{font-size:11px;font-weight:600;color:var(--t2)}
    .pay-amt-row{display:flex;align-items:center;gap:6px;margin-bottom:3px}
    .add-btn{display:inline-flex;align-items:center;gap:3px;background:none;border:1px dashed var(--s1);color:var(--t3);font-size:11px;padding:3px 8px;border-radius:4px;cursor:pointer;margin-top:4px}
    .add-btn:hover{background:var(--fill-3);color:var(--t2)}
    .in-total{font-size:12px;color:var(--t2);margin-top:7px;padding-top:6px;border-top:1px solid var(--s2)}
    .in-total b{color:var(--green-bar)}

    /* pane 3 */
    .p3-cell{min-width:260px}
    .sd-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
    .staff-sel{background:#fff;border:1px solid var(--s1);color:var(--t1);padding:3px 6px;border-radius:4px;font-size:12px;outline:none;max-width:90px}
    .staff-sel:focus{border-color:var(--accent)}
    .cost-lbl{font-size:11px;font-weight:500;color:var(--t1);white-space:nowrap}
    .out-total{font-size:12px;color:var(--t2);margin-top:7px;padding-top:6px;border-top:1px solid var(--s2);line-height:1.8}
    .out-total b{color:var(--red-bar)}

    .add-row-btn{width:100%;margin-top:10px;padding:9px;background:#fff;border:1px dashed var(--s1);color:var(--t2);font-size:13px;border-radius:6px;cursor:pointer}
    .add-row-btn:hover{background:var(--fill-3)}

    /* staff section */
    .staff-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    @media(max-width:900px){.staff-grid{grid-template-columns:repeat(2,1fr)}}
    .sc{border:1px solid var(--s2);border-radius:8px;padding:14px}
    .sc-name-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
    .sc-name-ipt{background:transparent;border:none;border-bottom:1px solid var(--s2);color:var(--t1);font-size:14px;font-weight:600;width:80px;outline:none;padding:2px 0}
    .sc-name-ipt:focus{border-bottom-color:var(--accent)}
    .sc-fields{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-bottom:10px;font-size:12px}
    .sc-field{display:flex;flex-direction:column;gap:2px}
    .sc-field label{font-size:10px;color:var(--t2)}
    .sc-computed{background:var(--fill-3);border-radius:5px;padding:7px 10px;font-size:11px;margin-bottom:8px;line-height:1.9}
    .sc-computed .r{display:flex;justify-content:space-between}
    .sc-computed b{color:var(--t1);font-weight:600}
    .chart-wrap{position:relative;height:140px;margin-top:4px}
    .no-data{text-align:center;color:var(--t3);font-size:12px;padding:28px 0}

    /* charts */
    .charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px}
    .ch{position:relative;height:230px}
    .footer-note{text-align:right;font-size:12px;color:var(--t3);margin-top:12px}

    /* print */
    .print-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:5px;border:1px solid var(--s1);background:#fff;color:var(--t2);font-size:12px;cursor:pointer;font-weight:500}
    .print-btn:hover{background:var(--fill-3)}
    .save-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 18px;border-radius:5px;border:none;background:var(--green);color:#fff;font-size:13px;cursor:pointer;font-weight:600;transition:opacity .15s}
    .save-btn:hover{opacity:.85}
    .save-btn.flash{background:#0a5c3f}
    .save-bar{display:flex;align-items:center;gap:10px;padding:7px 16px;border-radius:7px;font-size:12px;margin-bottom:12px}
    .save-bar.saved{background:rgba(26,122,88,.09);border:1px solid rgba(26,122,88,.25);color:var(--green)}
    .save-bar.unsaved{background:rgba(176,104,0,.07);border:1px solid rgba(176,104,0,.25);color:#8a6000}
    @media print{
      @page{size:A4;margin:12mm 14mm}
      body{font-size:11px}
      .page{max-width:none;padding:0}
      .mode-bar,.print-btn,.save-btn,.icon-btn,.add-btn,.add-row-btn,.overlay{display:none!important}
      .save-bar{border:1px solid #ccc!important;background:#f9f9f9!important;color:#333!important}
      .stat-card{break-inside:avoid}
      .charts-grid,.no-print{display:none!important}
      table{page-break-inside:auto}
      tr{page-break-inside:avoid;break-inside:avoid}
      .tbl-wrap{overflow:visible}
      th,td{padding:5px 8px!important;font-size:10px!important}
      .mini-box{font-size:10px!important}
      .pay-block{padding:5px 7px!important;margin-bottom:4px!important}
      .sd-row{margin-bottom:3px!important}
      input[type=number],input[type=text].ipt,input[type=date],.yr-select,select,.staff-sel{
        border:none!important;background:transparent!important;pointer-events:none;padding:0!important
      }
      input[type=checkbox]{pointer-events:none}
      .sc,.staff-grid,.staff-section{display:none!important}
      h2.staff-h2{display:none!important}
      .footer-note{display:none}
    }

    /* modal */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:100}
    .mbox{background:#fff;border-radius:10px;padding:30px 34px;width:310px;border:1px solid var(--s1)}
    .mbox h3{font-size:15px;font-weight:600;margin-bottom:7px}
    .mbox p{font-size:13px;color:var(--t2);margin-bottom:18px}
    .mbox input[type=password]{width:100%;padding:8px 10px;border:1px solid var(--s1);border-radius:5px;font-size:15px;outline:none;letter-spacing:4px;margin-bottom:6px}
    .mbox input[type=password]:focus{border-color:var(--accent)}
    .merr{font-size:12px;color:var(--red);min-height:16px;margin-bottom:10px}
    .macts{display:flex;gap:8px;justify-content:flex-end}
    .macts button{padding:7px 16px;border-radius:5px;font-size:13px;cursor:pointer;border:1px solid var(--s1)}
    .bp{background:var(--accent);color:#fff;border-color:var(--accent)!important}
    .bc{background:#fff;color:var(--t1)}
  </style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef} = React;
let STD_DAYS=261; // overwritten each render by data.stdDaysYear
const UNIT=20; // points per day (20pt = 1日)

// ── helpers ────────────────────────────────────────────────────────────────
const fmtM=n=>{const v=Math.round(Number(n)||0);return v?'¥'+v.toLocaleString('en-US'):'—';};
const pctStr=(a,t)=>(!t||!a)?'':((a/t)*100).toFixed(1)+'%';

const QUARTERS=['Q1','Q2','Q3','Q4'];
const Q_DAYS={Q1:65,Q2:65,Q3:65,Q4:66}; // 法定工作日 per quarter (total 261)
const Q_MONTHS={Q1:[1,2,3],Q2:[4,5,6],Q3:[7,8,9],Q4:[10,11,12]};

function dateToQ(dateStr){
  if(!dateStr)return null;
  const m=parseInt((dateStr||'').split('-')[1]);
  if(m<=3)return'Q1'; if(m<=6)return'Q2'; if(m<=9)return'Q3'; return'Q4';
}
// Q ごとの今年の消化営業日数（月〜金）を自動計算
function calcConsumedDays(q){
  const today=new Date();
  const y=today.getFullYear();
  const ranges={Q1:[1,1,3,31],Q2:[4,1,6,30],Q3:[7,1,9,30],Q4:[10,1,12,31]};
  const [sm,sd,em,ed]=ranges[q];
  const start=new Date(y,sm-1,sd);
  const end  =new Date(y,em-1,ed);
  if(today<start)return 0;
  const limit=today<end?today:end;
  let count=0;
  const d=new Date(start);
  while(d<=limit){const dw=d.getDay();if(dw!==0&&dw!==6)count++;d.setDate(d.getDate()+1);}
  return count;
}
// weekDate があれば日付から、なければ旧 quarter フィールドを使う（後方互換）
function sdToQ(sd){return sd.weekDate?dateToQ(sd.weekDate):(sd.quarter||null);}
const todayStr=()=>new Date().toISOString().slice(0,10);

// 指定した年月（'2026-05' など）に適用される月基本給を返す
function getSalaryForMonth(s, yearMonth){
  const periods=(s.salaryPeriods||[]);
  if(periods.length===0) return s.monthlySalary||0; // 旧データ互換
  const sorted=[...periods].sort((a,b)=>(a.from||'').localeCompare(b.from||''));
  if(!yearMonth) return sorted[sorted.length-1]?.amount||0;
  // yearMonth 以下で最も遅い from を選ぶ
  const applicable=sorted.filter(p=>(p.from||'')<=yearMonth);
  if(applicable.length>0) return applicable[applicable.length-1].amount||0;
  return sorted[0]?.amount||0; // 全て after なら最初の期間
}
function payroll(s, yearMonth){
  const monthly=getSalaryForMonth(s, yearMonth);
  const base12 =monthly*12;
  const bonus  =s.bonusAmount||0;
  const total  =base12+bonus;
  const reg    =total/STD_DAYS;
  const ovt    =base12/STD_DAYS;
  return{base12,bonus,total,reg,ovt,monthly};
}
function getDailyRate(s, yearMonth){return payroll(s, yearMonth).reg;}
// 四半期の代表年月（その Q の日給計算に使用）
const Q_MIDMONTH={Q1:'-02',Q2:'-05',Q3:'-08',Q4:'-11'};
let CURRENT_PERIOD='2026'; // App レンダリング時に上書き
function getDailyRateForQ(s, q){return getDailyRate(s, CURRENT_PERIOD+Q_MIDMONTH[q]);}

// staffDay は {staffId, q1, q2, q3, q4} — 値はポイント(20pt=1日)
function sdPts(sd){return(sd.q1||0)+(sd.q2||0)+(sd.q3||0)+(sd.q4||0);}
function sdTotalDays(sd){return sdPts(sd)/UNIT;}
function ptsToDay(pts){return pts/UNIT;}
function calcLaborCost(p,staff){
  return(p.out.staffDays||[]).reduce((a,sd)=>{
    const s=staff.find(x=>x.id===sd.staffId)||{};
    // Q 別レートで積算
    return a+QUARTERS.reduce((s2,q)=>{
      const days=(sd[q.toLowerCase()]||0)/UNIT;
      return s2+days*getDailyRateForQ(s,q);
    },0);
  },0);
}
// 実収額（actualAmount）or incomes.amount
function calcTotalIn(p){
  if(p.type==='indirect') return(p.in.incomes||[]).reduce((a,r)=>a+(r.amount||0),0);
  return(p.in.payments||[]).reduce((a,r)=>a+(r.actualAmount||0),0);
}
// 四半期別入金
function calcInByQ(projects,q){
  return projects.reduce((s,p)=>{
    if(p.type==='indirect'){
      return(p.in.incomes||[]).reduce((a,r)=>{
        if((r.amount||0)>0&&dateToQ(r.date)===q)a+=r.amount;
        return a;
      },s);
    }
    return(p.in.payments||[]).reduce((a,r)=>{
      if((r.actualAmount||0)>0&&dateToQ(r.actualDate)===q)a+=r.actualAmount;
      return a;
    },s);
  },0);
}
// 四半期別人件費（Q別レート使用）
function calcLaborByQ(projects,staff,q){
  const k=q.toLowerCase();
  return projects.reduce((s,p)=>s+(p.out.staffDays||[]).reduce((a,sd)=>{
    const st=staff.find(x=>x.id===sd.staffId)||{};
    return a+((sd[k]||0)/UNIT)*getDailyRateForQ(st,q);
  },0),0);
}
function calcOverhead(labor,rate){return Math.round(labor*(rate/100));}
function calcSubcontractCost(p){return(p.out.subcontracts||[]).reduce((a,s)=>a+(s.amount||0),0);}
function calcSubcontractByQ(projects,q){
  return projects.reduce((s,p)=>(p.out.subcontracts||[]).reduce((a,sc)=>{
    if((sc.amount||0)>0&&dateToQ(sc.date)===q)a+=sc.amount;
    return a;
  },s),0);
}
function calcTotalOut(p,staff,rate){const l=calcLaborCost(p,staff);return l+calcOverhead(l,rate)+calcSubcontractCost(p);}
// 合同合計（复数协议求和）
function getContractTotal(p){return(p.in.contracts||[]).reduce((s,c)=>s+(c.amount||0),0);}
// スタッフ移行: monthlySalary(旧単値) → salaryPeriods(新配列)
function migrateStaff(s){
  if(!s.salaryPeriods){
    return{...s,salaryPeriods:[{from:'',amount:s.monthlySalary||0}]};
  }
  return s;
}
// データ移行: contractAmount(旧) → contracts(新)、type フラグ追加、incomes 追加
function migrateProject(p){
  let q={...p};
  if(!q.in.contracts){
    const amt=q.in.contractAmount||0;
    const{contractAmount:_,...rest}=q.in;
    q={...q,in:{...rest,contracts:[{label:'契約総額',amount:amt}]}};
  }
  if(!q.type)q={...q,type:'design'};
  if(!q.in.incomes)q={...q,in:{...q.in,incomes:[]}};
  if(!q.out.subcontracts)q={...q,out:{...q.out,subcontracts:[]}};
  return q;
}
function staffTotalDays(sid,projects){
  return projects.reduce((a,p)=>{const sd=(p.out.staffDays||[]).find(x=>x.staffId===sid);return a+(sd?.days||0);},0);
}

// ── MoneyInput ────────────────────────────────────────────────────────────
function MoneyInput({value,onChange,style,placeholder}){
  const fmt=v=>v?Number(v).toLocaleString('en-US'):'';
  const [txt,setTxt]=useState(fmt(value));
  const [editing,setEditing]=useState(false);
  useEffect(()=>{if(!editing)setTxt(fmt(value));},[value,editing]);
  return(
    <input type="text" style={{textAlign:'right',...style}}
      placeholder={placeholder||'0'}
      value={txt}
      onFocus={()=>{setEditing(true);setTxt(value?String(value):'');}}
      onBlur={()=>{
        const n=Number(txt.replace(/,/g,''));
        const safe=isNaN(n)?0:n;
        setTxt(fmt(safe)); setEditing(false); onChange(safe);
      }}
      onChange={e=>{
        const v=e.target.value;
        if(/^[\d,]*$/.test(v)){
          setTxt(v);
          const n=Number(v.replace(/,/g,''));
          if(!isNaN(n))onChange(n);
        }
      }}
    />
  );
}

// 先週の月曜日を返す（月曜に記録するので先週分がデフォルト）
function lastMonday(){
  const d=new Date();
  const day=d.getDay()||7; // 日=0→7に
  d.setDate(d.getDate()-day-6); // 先週月曜
  return d.toISOString().slice(0,10);
}

// ── StaffCard ─────────────────────────────────────────────────────────────
function StaffCard({s,projects,isAdmin,stdDaysQ,upd,del}){
  const ref=useRef(null);const chart=useRef(null);
  const slices=projects.map(p=>{
    const sd=(p.out.staffDays||[]).find(x=>x.staffId===s.id);
    return{name:p.name,days:sd?sdTotalDays(sd):0};
  }).filter(x=>x.days>0);
  const totalDays=slices.reduce((a,x)=>a+x.days,0);
  // 現在の基本給（最新期間）で payroll 計算
  const currentYM=CURRENT_PERIOD+'-12'; // 年末を基準に最新給与を使用
  const pw=payroll(s, currentYM);
  // per-quarter days for this staff member
  const qDays=QUARTERS.reduce((o,q)=>{
    const k=q.toLowerCase();
    o[q]=projects.reduce((s2,p)=>{
      const sd=(p.out.staffDays||[]).find(x=>x.staffId===s.id);
      return s2+(sd?sd[k]||0:0);
    },0);
    return o;
  },{});
  const overtimeDays=QUARTERS.reduce((sum,q)=>sum+Math.max(0,(qDays[q]||0)-(stdDaysQ?stdDaysQ[q]||0:0)),0);
  const effectiveDays=STD_DAYS-(s.paidLeaveDays||0);

  // 产值计算: 按各プロジェクト中该员工的工时占比分摊合同额和实收额
  const totalCost=totalDays*getDailyRate(s);
  let contractShare=0, actualShare=0;
  projects.forEach(p=>{
    const sd=(p.out.staffDays||[]).find(x=>x.staffId===s.id);
    if(!sd)return;
    const myDays=sdTotalDays(sd);
    if(!myDays)return;
    const projTotal=p.out.staffDays.reduce((a,x)=>a+sdTotalDays(x),0);
    const w=projTotal>0?myDays/projTotal:0;
    if(p.in.contracted)contractShare+=getContractTotal(p)*w;
    actualShare+=calcTotalIn(p)*w;
  });
  const yuchan =totalCost>0?contractShare/totalCost:0;
  const shijichan=totalCost>0?actualShare /totalCost:0;

  useEffect(()=>{
    if(!ref.current)return;
    if(chart.current)chart.current.destroy();
    if(slices.length===0)return;
    chart.current=new Chart(ref.current,{
      type:'doughnut',
      data:{labels:slices.map(x=>x.name),datasets:[{
        data:slices.map(x=>x.days),
        backgroundColor:PIE_COLORS,borderWidth:1,borderColor:'#fff',hoverOffset:5
      }]},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{
          legend:{position:'bottom',labels:{font:{size:10},boxWidth:10,padding:7,color:'rgba(20,20,20,.5)'}},
          tooltip:{callbacks:{label:c=>` ${c.label}: ${c.parsed}日`}}
        }
      }
    });
    return()=>{if(chart.current)chart.current.destroy();};
  },[JSON.stringify(slices)]);

  return(
    <div className="sc">
      <div className="sc-name-row">
        <input className="sc-name-ipt" type="text" value={s.name} onChange={e=>upd(s.id,'name',e.target.value)}/>
        {totalDays>0&&<span style={{fontSize:11,color:'var(--t3)'}}>計{totalDays}日</span>}
        <button onClick={del} title="スタッフ削除"
          style={{marginLeft:'auto',background:'none',border:'none',cursor:'pointer',color:'var(--t3)',fontSize:13,lineHeight:1,padding:'0 2px'}}
          >×</button>
      </div>
      {isAdmin&&<>
        {/* 薪资期間リスト */}
        <div style={{marginBottom:6}}>

// ── BarChart ──────────────────────────────────────────────────────────────
function BC({categories,series,height,stacked}){
  const ref=useRef(null);const c=useRef(null);
  useEffect(()=>{
    if(!ref.current)return;
    if(c.current)c.current.destroy();
    c.current=new Chart(ref.current,{
      type:'bar',
      data:{labels:categories,datasets:series.map(s=>({
        label:s.label,data:s.data,backgroundColor:s.color,
        borderRadius:3,borderSkipped:false,stack:stacked?'s':undefined
      }))},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{
          legend:{labels:{color:'rgba(20,20,20,.5)',font:{size:12},boxWidth:12,padding:14}},
          tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ¥${c.parsed.y.toLocaleString('ja-JP')}`}},
        },
        scales:{
          x:{stacked:!!stacked,grid:{color:'rgba(20,20,20,.07)'},ticks:{color:'rgba(20,20,20,.45)',font:{size:11}}},
          y:{stacked:!!stacked,grid:{color:'rgba(20,20,20,.07)'},ticks:{color:'rgba(20,20,20,.45)',font:{size:11},callback:v=>'¥'+(v/10000).toFixed(0)+'万'}},
        }
      }
    });
    return()=>{if(c.current)c.current.destroy();};
  },[JSON.stringify({categories,series,stacked})]);
  return <div style={{position:'relative',height}}><canvas ref={ref}/></div>;
}

// ── App ───────────────────────────────────────────────────────────────────
function App(){
  // ローカルストレージからロード（フォールバック用）
  const migrateAll=(raw)=>{
    Object.keys(raw).forEach(k=>{if(Array.isArray(raw[k]))raw[k]=raw[k].map(migrateProject);});
    if(Array.isArray(raw.staff))raw.staff=raw.staff.map(migrateStaff);
    return raw;
  };
  const loadLocal=()=>{
    try{
      const raw=JSON.parse(localStorage.getItem(STORAGE_KEY));
      if(raw)return migrateAll(raw);
      const old=JSON.parse(localStorage.getItem(STORAGE_KEY));
      if(old)return migrateAll(old);
      return INIT_DATA;
    }catch{return INIT_DATA;}
  };
  const hasRealData=d=>{
    if(!d||typeof d!=='object')return false;
    const yrs=Object.keys(d).filter(k=>/^\d{4}$/.test(k));
    const hasProj=yrs.some(y=>(d[y]||[]).some(p=>(p.name||'').trim()||(p.projectNumber||'').trim()));
    const hasStaff=(d.staff||[]).some(s=>(s.name||'').trim()&&s.name!=='新規スタッフ');
    return hasProj||hasStaff||yrs.some(y=>(d[y]||[]).some(p=>
      (p.out?.staffDays||[]).some(sd=>sdPts(sd)>0)||calcTotalIn(p)>0
    ));
  };
  const isFileProtocol=()=>true; // 提出用：常にローカル専用

  const [data,setData]       =useState(()=>loadLocal());
  const dataRef              =useRef(null);
  dataRef.current            =data;
  const [hydrated,setHydrated]=useState(false);
  const [loadInfo,setLoadInfo]=useState('');
  const [period,setPeriod]   =useState('2026');
  const [isAdmin,setIsAdmin] =useState(false);
  const [showPin,setShowPin] =useState(false);
  const [pin,setPin]         =useState('');
  const [pinErr,setPinErr]   =useState('');
  const [addingYr,setAddingYr]=useState(false);
  const [newYr,setNewYr]     =useState('');
  const [reportDate,setReportDate]=useState(()=>new Date().toISOString().slice(0,10));
  const [reportBy,setReportBy]   =useState('');
  const [lastSaved,setLastSaved] =useState(()=>{try{return JSON.parse(localStorage.getItem(META_KEY))||JSON.parse(localStorage.getItem(META_KEY))||null;}catch{return null;}});
  const [saveFlash,setSaveFlash]       =useState(false);
  const [lastSaveKind,setLastSaveKind] =useState(null); // 'server' | 'local'
  const [openSubs,setOpenSubs]         =useState(new Set());
  const toggleSub=id=>setOpenSubs(prev=>{const s=new Set(prev);s.has(id)?s.delete(id):s.add(id);return s;});
  const ALL_STATUSES=new Set(Object.keys(S_LABEL));
  const [visibleStatuses,setVisibleStatuses]=useState(new Set(Object.keys(S_LABEL)));
  const toggleVisible=st=>setVisibleStatuses(prev=>{const s=new Set(prev);s.has(st)?s.delete(st):s.add(st);return s;});
  const [collapsedProjects,setCollapsedProjects]=useState(new Set());
  const toggleCollapse=id=>setCollapsedProjects(prev=>{const s=new Set(prev);s.has(id)?s.delete(id):s.add(id);return s;});
  const collapseAll=()=>setCollapsedProjects(new Set(sortedProjects?.map(p=>p.id)||[]));
  const expandAll=()=>setCollapsedProjects(new Set());
  const [savedSnapshot,setSavedSnapshot]=useState(()=>{try{const r=JSON.parse(localStorage.getItem(STORAGE_KEY));if(r)return r;return null;}catch{return null;}});
  const [serverMode,setServerMode]=useState(false); // サーバーから読み込めたかどうか

  // 提出用：デモデータのみ（会社サーバー非接続）
  useEffect(()=>{
    const snap=loadLocal();
    setData(snap);
    setSavedSnapshot(JSON.parse(JSON.stringify(snap)));
    setServerMode(false);
    if(snap.reportBy)setReportBy(snap.reportBy);
    if(snap.reportDate)setReportDate(snap.reportDate);
    setLoadInfo('デモデータ（架空の設計事務所サンプル）');
    setHydrated(true);
  },[]);

  // 初回ロード完了後のみ localStorage に書く（空データで上書きしない）
  useEffect(()=>{
    if(!hydrated||!data)return;
    localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
  },[data,hydrated]);

  if(!isFileProtocol()&&!hydrated){
    return(
      <div className="page" style={{padding:48,textAlign:'center',color:'var(--t2)'}}>
        <div style={{fontSize:16,marginBottom:8}}>データを読み込み中…</div>
        <div style={{fontSize:12}}>しばらくお待ちください</div>
      </div>
    );
  }
  if(!data){
    return(
      <div className="page" style={{padding:48,textAlign:'center',color:'var(--red)'}}>
        読み込みに失敗しました。ページを再読み込みしてください
      </div>
    );
  }

  const years=Object.keys(data).filter(k=>/^\d{4}$/.test(k)).sort();
  const projects=data[period]||[];
  const staff=data.staff||[];

  // プロジェクト番号または名前で年間度の累計人件費を返す
  function calcLifetimeLabor(p){
    const key=p.projectNumber||p.name||'';
    if(!key)return null;
    return years.reduce((total,yr)=>{
      const ps=data[yr]||[];
      const match=ps.find(x=>(x.projectNumber&&x.projectNumber===p.projectNumber)||(x.name&&x.name===p.name));
      return total+(match?calcLaborCost(match,staff):0);
    },0);
  }
  const ovhdRate=data.overheadRate||40;
  // 自動計算：カレンダーから今年の各Q消化営業日数
  const stdDaysQ=Object.fromEntries(QUARTERS.map(q=>[q,calcConsumedDays(q)]));
  const stdDaysTotal=QUARTERS.reduce((s,q)=>s+(stdDaysQ[q]||0),0);

  // make STD_DAYS reflect the editable year setting
  STD_DAYS=data.stdDaysYear||261;
  CURRENT_PERIOD=period; // Q別日給計算で使用
  // Q caps: Q1-Q3 = 65, Q4 = remainder
  const qDaysCap={Q1:65,Q2:65,Q3:65,Q4:Math.max(0,STD_DAYS-195)};

  // summaries
  const designProjects  =projects.filter(p=>p.type!=='indirect');
  const indirectProjects=projects.filter(p=>p.type==='indirect');
  const designLabor =designProjects .reduce((s,p)=>s+calcLaborCost(p,staff),0);
  const indirectLabor=indirectProjects.reduce((s,p)=>s+calcLaborCost(p,staff),0);

  const totalIn        =projects.reduce((s,p)=>s+calcTotalIn(p),0);
  const totalContracted=designProjects.reduce((s,p)=>{
    const sum=(p.contracts||[]).reduce((a,c)=>a+(c.amount||0),0);
    return s+(sum||0);
  },0);
  const totalLabor=projects.reduce((s,p)=>s+calcLaborCost(p,staff),0);
  const totalOvhd =calcOverhead(totalLabor,ovhdRate);
  const totalSub  =projects.reduce((s,p)=>s+calcSubcontractCost(p),0);
  const totalOut  =totalLabor+totalOvhd+totalSub;
  const net       =totalIn-totalOut;

  // quarterly
  const qIn   =QUARTERS.map(q=>calcInByQ(projects,q));
  const qLabor=QUARTERS.map(q=>calcLaborByQ(projects,staff,q));
  const qOvhd =qLabor.map(l=>calcOverhead(l,ovhdRate));
  const qSub  =QUARTERS.map(q=>calcSubcontractByQ(projects,q));
  const updStdQ=(q,v)=>setData(prev=>({...prev,standardDaysQ:{...(prev.standardDaysQ||{}),Q1:0,Q2:0,Q3:0,Q4:0,...(prev.standardDaysQ||{}),[q]:Number(v)}}));

  // project updaters
  function updP(id,fn){setData(prev=>({...prev,[period]:prev[period].map(p=>p.id===id?fn(p):p)}));}
  const updIn =(id,f,v)=>updP(id,p=>({...p,in:{...p.in,[f]:v}}));
  const updPay=(id,ri,f,v)=>updP(id,p=>({...p,in:{...p.in,payments:p.in.payments.map((r,i)=>i===ri?{...r,[f]:v}:r)}}));
  const addPay=(id)=>updP(id,p=>({...p,in:{...p.in,payments:[...p.in.payments,{label:'',demandDone:false,deliveryDone:false,note:'',amount:0,actualDate:'',actualAmount:0}]}}));
  const delPay=(id,ri)=>updP(id,p=>({...p,in:{...p.in,payments:p.in.payments.filter((_,i)=>i!==ri)}}));
  const updSD   =(id,si,f,v)=>updP(id,p=>({...p,out:{...p.out,staffDays:p.out.staffDays.map((sd,i)=>i===si?{...sd,[f]:v}:sd)}}));
  const addSD   =(id)=>updP(id,p=>({...p,out:{...p.out,staffDays:[...p.out.staffDays,{staffId:'',q1:0,q2:0,q3:0,q4:0}]}}));
  const removeSD=(id,si)=>updP(id,p=>({...p,out:{...p.out,staffDays:p.out.staffDays.filter((_,i)=>i!==si)}}));

  // staff updaters
  function updS(sid,field,val){
    const stringFields=['name','contractExpiry','notes'];
    const arrayFields=['salaryPeriods'];
    const v=stringFields.includes(field)?val:arrayFields.includes(field)?val:Number(val);
    setData(prev=>({...prev,staff:prev.staff.map(s=>s.id===sid?{...s,[field]:v}:s)}));
  }
  function addStaff(dept='design'){setData(prev=>({...prev,staff:[...prev.staff,{id:'s'+Date.now(),name:'新規スタッフ',dept,salaryPeriods:[{from:'',amount:0}],bonusAmount:0,paidLeaveDays:0,contractExpiry:'',notes:'',lastYearMonthly:0,lastYearBonus:0,lastYearAnnual:0}]}));}

  function delProject(id){
    if(!window.confirm('このプロジェクトを削除しますか？元に戻せません。'))return;
    setData(prev=>({...prev,[period]:prev[period].filter(p=>p.id!==id)}));
  }
  function delStaff(sid){
    if(!window.confirm('このスタッフを削除しますか？元に戻せません。'))return;
    setData(prev=>({...prev,staff:prev.staff.filter(s=>s.id!==sid)}));
  }
  // contract entries
  function addContract(id){updP(id,p=>({...p,in:{...p.in,contracts:[...(p.in.contracts||[]),{label:'追加契約',amount:0}]}}));}
  function delContract(id,ci){updP(id,p=>({...p,in:{...p.in,contracts:(p.in.contracts||[]).filter((_,i)=>i!==ci)}}));}
  function updContract(id,ci,f,v){updP(id,p=>({...p,in:{...p.in,contracts:(p.in.contracts||[]).map((c,i)=>i===ci?{...c,[f]:f==='label'?v:Number(v)}:c)}}));}

  // design fee updaters（契約金額への自動同期なし）
  function updDF(id,di,f,v){
    updP(id,p=>({...p,designFees:(p.designFees||[]).map((d,i)=>i===di?{...d,[f]:f==='specialty'?v:Number(v)}:d)}));
  }
  function addDF(id){updP(id,p=>({...p,designFees:[...(p.designFees||[]),{specialty:'',area:0,unitPrice:0}]}));}
  function delDF(id,di){updP(id,p=>({...p,designFees:(p.designFees||[]).filter((_,i)=>i!==di)}));}

  function addProject(type='design'){setData(prev=>({...prev,[period]:[...(prev[period]||[]),{
    id:'p'+Date.now(),projectNumber:'',
    name:type==='indirect'?'新規部門':'新規プロジェクト',
    status:'active',type,
    designFees:[{specialty:'',area:0,unitPrice:0}],
    in:{contracted:false,negotiating:false,contracts:[{label:'契約総額',amount:0}],payments:[{demandDone:false,deliveryDone:false,note:'',amount:0}],incomes:[]},
    out:{staffDays:[],subcontracts:[]},
  }]}));}

  function addYear(){
    if(/^\d{4}$/.test(newYr)&&!data[newYr]){
      // 直前年のプロジェクトをベースに、スタッフ投入ポイントだけリセット
      const prevYr=String(Number(newYr)-1);
      const prevProjects=Array.isArray(data[prevYr])?data[prevYr]:[];
      const resetProjects=prevProjects.map(p=>({
        ...p,
        out:{...p.out, staffDays:[]},    // 投入ポイントをリセット
        id:'p'+Date.now()+Math.random(), // IDを新発行（重複防止）
      }));
      if(!window.confirm(`新年度 ${newYr} を作成します。\n${prevYr}年度のプロジェクト（${resetProjects.length}件）を引き継ぎ、\nスタッフ工数をリセットします。\nよろしいですか？`)){
        setAddingYr(false);setNewYr('');return;
      }
      setData(prev=>({...prev,[newYr]:resetProjects}));
      setPeriod(newYr);
    }
    setAddingYr(false);setNewYr('');
  }

  async function submitPin(){
    if(pin===DEMO_PIN){setIsAdmin(true);setShowPin(false);setPinErr('');}
    else setPinErr('PINが違います（デモ: 1234）');
  }

  function exportData(){
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const d=new Date();
    const stamp=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
    a.href=url; a.download=`school_demo_backup_${stamp}.json`; a.click();
    URL.revokeObjectURL(url);
  }

  function importData(e){
    const file=e.target.files[0]; if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const parsed=JSON.parse(ev.target.result);
        if(!parsed.staff)throw new Error('無効なデータ形式');
        if(!window.confirm('現在のデータをインポートしたファイルで上書きします。よろしいですか？'))return;
        const migrated={...parsed,staff:(parsed.staff||[]).map(migrateStaff)};
        Object.keys(migrated).filter(k=>/^\d{4}$/.test(k)).forEach(yr=>{
          migrated[yr]=(migrated[yr]||[]).map(migrateProject);
        });
        setData(migrated);
        localStorage.setItem(STORAGE_KEY,JSON.stringify(migrated));
        alert('インポート完了。「保存」でブラウザに記録されます。');
      }catch(err){alert('読み込み失敗：'+err.message);}
    };
    reader.readAsText(file);
    e.target.value='';
  }

  async function handleSave(){
    const snap=dataRef.current||data;
    if(!snap){alert('データの読み込みが完了していません');return;}
    const payload={...snap,reportBy,reportDate,_meta:{...(snap._meta||{}),savedAt:new Date().toISOString()}};
    localStorage.setItem(STORAGE_KEY,JSON.stringify(payload));
    const meta={
      timestamp:new Date().toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}),
      by:reportBy||'—',date:reportDate,serverSaved:false,
    };
    localStorage.setItem(META_KEY,JSON.stringify(meta));
    setData(payload);
    setLastSaved(meta);
    setLastSaveKind('local');

                            }/>
                          <button onClick={()=>updP(p.id,x=>({...x,in:{...x.in,incomes:(x.in.incomes||[]).filter((_,i)=>i!==ii)}}))}
                            style={{background:'none',border:'none',cursor:'pointer',color:'var(--t3)',fontSize:14,lineHeight:1,padding:'0 2px'}}>×</button>
                        </div>
                      ))}
                      <button className="add-btn" onClick={()=>updP(p.id,x=>({...x,in:{...x.in,incomes:[...(x.in.incomes||[]),{label:'',amount:0,date:''}]}}))}>
                        ＋ 収入を追加
                      </button>
                      {(p.in.incomes||[]).some(r=>r.amount>0)&&(
                        <div className="in-total">已收合計：<b>{fmtM(calcTotalIn(p))}</b></div>
                      )}
                    </div>
                  </td>
                  {/* Pane3: OUT（设计プロジェクトと同じ） */}
                  <td className="bl">
                    <div className="p3-cell">
                      {[...(p.out.staffDays||[])].sort((a,b)=>{
                        const ai=staff.findIndex(x=>x.id===a.staffId);
                        const bi=staff.findIndex(x=>x.id===b.staffId);
                        return(ai<0?999:ai)-(bi<0?999:bi);
                      }).map(sd=>{
                        const si=(p.out.staffDays||[]).indexOf(sd);
                        const savedProj=(savedSnapshot?.[period]||[]).find(x=>x.id===p.id);
                        const savedSd=(savedProj?.out?.staffDays||[]).find(x=>x.staffId===sd.staffId);
                        return(
                          <StaffDayRow key={si} sd={sd} si={si} pId={p.id}
                            staff={staff} isAdmin={isAdmin}
                            updSD={updSD} removeSD={removeSD} savedSd={savedSd}/>
                        );
                      })}
                      <button className="add-btn" onClick={()=>addSD(p.id)}>＋ スタッフ追加</button>
                      {isAdmin&&(
                        <div className="out-total">
                          人件費：<b>{fmtM(labor)}</b><br/>
                          運営費（×{ovhdRate}%）：<b>{fmtM(ovhd)}</b>
                        </div>
                      )}
                      {/* 設計外注費（折りたたみ） */}
                      {(()=>{
                        const subs=p.out.subcontracts||[];
                        const subTotal=sub;
                        const isOpen=openSubs.has(p.id);
                        const updSubs=fn=>updP(p.id,x=>({...x,out:{...x.out,subcontracts:fn(x.out.subcontracts||[])}}));
                        return(
                          <div style={{marginTop:8,borderTop:'1px dashed var(--s2)',paddingTop:6}}>
                            <button onClick={()=>toggleSub(p.id)}
                              style={{background:'none',border:'none',cursor:'pointer',fontSize:11,color:subTotal>0?'#8a5000':'var(--t3)',padding:0,display:'flex',alignItems:'center',gap:4,fontWeight:subTotal>0?600:400}}>
                              <span>{isOpen?'▼':'▶'}</span>
                              <span>設計外注費</span>
                              {subs.length>0&&<span style={{color:'#c07800'}}>（{subs.length}件 {fmtM(subTotal)}）</span>}
                            </button>
                            {isOpen&&(
                              <div style={{marginTop:6,paddingLeft:4}}>
                                {subs.map((sc,sci)=>(
                                  <div key={sci} style={{display:'grid',gridTemplateColumns:'1fr 100px 90px auto',alignItems:'center',gap:'4px 6px',marginBottom:5}}>
                                    <input type="text" className="ipt" style={{fontSize:11,padding:'3px 6px'}}
                                      placeholder="外注内容（例：ランドスケープ）"
                                      value={sc.label||''} onChange={e=>updSubs(s=>s.map((r,i)=>i===sci?{...r,label:e.target.value}:r))}/>
                                    <input type="date" style={{fontSize:11,padding:'2px 4px',border:'1px solid var(--s1)',borderRadius:4,outline:'none',color:'var(--t1)',width:'100%'}}
                                      value={sc.date||''} onChange={e=>updSubs(s=>s.map((r,i)=>i===sci?{...r,date:e.target.value}:r))}/>
                                    <MoneyInput style={{width:'100%',background:sc.amount>0?'rgba(176,104,0,.08)':'#fff'}}
                                      value={sc.amount||0} onChange={v=>updSubs(s=>s.map((r,i)=>i===sci?{...r,amount:v}:r))}/>
                                    <button onClick={()=>updSubs(s=>s.filter((_,i)=>i!==sci))}
                                      style={{background:'none',border:'none',cursor:'pointer',color:'var(--t3)',fontSize:14,lineHeight:1,padding:'0 2px'}}>×</button>
                                  </div>
                                ))}
                                <button className="add-btn" style={{fontSize:10}} onClick={()=>updSubs(s=>[...s,{label:'',date:'',amount:0}])}>＋ 外注を追加</button>
                                {subTotal>0&&<div style={{fontSize:11,color:'#8a5000',fontWeight:600,marginTop:4}}>外注合計：{fmtM(subTotal)}</div>}
                              </div>
                            )}
                          </div>
                        );
                      })()}
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <button className="add-row-btn" onClick={()=>addProject('indirect')}>＋ 間接部門を追加</button>

      <hr className="divider"/>

      {/* Pane 4 — staff */}
      <h2 className="staff-h2">スタッフ管理{!isAdmin&&<span style={{fontSize:12,fontWeight:400,color:'var(--t3)',marginLeft:8}}>（管理者モードで給与設定可）</span>}</h2>

      {/* workday context note */}
      <div style={{fontSize:12,color:'var(--t3)',marginBottom:12}}>各四半期の消化日数を超えた工数は残業として計上されます</div>

      {(()=>{
        const MGMT_NAMES=['中村','小林','加藤'];
        const isDesign  =s=>s.dept==='design'   ||(s.dept==null&&!MGMT_NAMES.includes(s.name));
        const isMgmt    =s=>s.dept==='mgmt'||s.dept==='management'||(s.dept==null&&MGMT_NAMES.includes(s.name));
        const designStaff=staff.filter(isDesign);
        const mgmtStaff  =staff.filter(isMgmt);
        const cardRow=(s)=>(
          <StaffCard key={s.id} s={s} projects={projects} isAdmin={isAdmin} stdDaysQ={stdDaysQ}
            upd={(sid,f,v)=>updS(sid,f,v)} del={()=>delStaff(s.id)}/>
        );
        return(<>
          <div style={{marginBottom:6,fontWeight:600,fontSize:13,color:'var(--accent)',borderLeft:'3px solid var(--accent)',paddingLeft:8}}>設計部門</div>
          <div className="staff-grid staff-section" style={{marginBottom:6}}>
            {designStaff.map(cardRow)}
          </div>
          <button className="add-btn no-print" style={{marginBottom:22,fontSize:12,padding:'5px 14px'}} onClick={()=>addStaff('design')}>＋ 設計部門スタッフを追加</button>
          <div style={{marginBottom:6,fontWeight:600,fontSize:13,color:'#8a5000',borderLeft:'3px solid #8a5000',paddingLeft:8}}>管理部門</div>
          <div className="staff-grid staff-section" style={{marginBottom:6}}>
            {mgmtStaff.map(cardRow)}
          </div>
          <button className="add-btn no-print" style={{marginBottom:8,fontSize:12,padding:'5px 14px'}} onClick={()=>addStaff('management')}>＋ 管理部門スタッフを追加</button>
        </>);
      })()}

      {/* charts — admin only */}
      {isAdmin&&<>
        <hr className="divider"/>
        <div className="charts-grid">
          <div>
            <h2>IN / OUT 比較</h2>
            <BC height={230} categories={sortedProjects.map(p=>p.name)}
              series={[
                {label:'入金済',data:sortedProjects.map(p=>calcTotalIn(p)),color:'rgba(26,122,88,.75)'},
                {label:'支出合計',data:sortedProjects.map(p=>calcTotalOut(p,staff,ovhdRate)),color:'rgba(192,48,74,.7)'},
              ]}/>
          </div>
          <div>
            <h2>人件費 — スタッフ別内訳</h2>
            <BC height={230} categories={sortedProjects.map(p=>p.name)} stacked
              series={staffWithData.map((s,i)=>({
                label:s.name,
                data:sortedProjects.map(p=>{const sd=p.out.staffDays.find(x=>x.staffId===s.id);return sd?(sd.days||0)*getDailyRate(s):0;}),
                color:PIE_COLORS[i%PIE_COLORS.length],
              }))}/>
          </div>
        </div>
      </>}

      <div className="footer-note">
        {period}年度　·　更改后须点击「保存」才写入服务器　·　运营费 = 人件費 × {ovhdRate}%
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
